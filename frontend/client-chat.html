<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #0b1120;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #161f32;
            border-bottom: 1px solid #2a3a55;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .header .logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: contain;
            background: #0b1120;
            border: 1px solid #2a3a55;
            flex-shrink: 0;
        }
        .header .info {
            flex: 1;
            min-width: 0;
        }
        .header .info h1 {
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .header .info p {
            color: #94a3b8;
            font-size: 12px;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
        }
        .msg.client {
            align-self: flex-end;
            background: #f97316;
            color: #0b1120;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        .msg.owner {
            align-self: flex-start;
            background: #1a253b;
            color: #e2e8f0;
            border: 1px solid #2a3a55;
            border-bottom-left-radius: 4px;
        }
        .msg .meta {
            font-size: 10px;
            margin-top: 6px;
            opacity: 0.7;
            display: block;
        }
        .msg.client .meta { text-align: right; }
        .msg.owner .meta { text-align: left; }

        .info-banner {
            background: #111b2e;
            border: 1px solid #1e2a41;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 12px;
            text-align: center;
        }

        .input-area {
            background: #161f32;
            border-top: 1px solid #2a3a55;
            padding: 14px 24px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            position: sticky;
            bottom: 0;
        }
        .input-area .inner {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            background: #0b1120;
            border: 1px solid #2a3a55;
            color: #e2e8f0;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
            outline: none;
        }
        textarea:focus { border-color: #f97316; }
        button.send {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f97316;
            border: none;
            color: #0b1120;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }
        button.send:hover { background: #ea580c; }
        button.send:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="header" id="header">
    <img class="logo" id="companyLogo" style="display:none;" />
    <div class="info">
        <h1 id="companyName">Conversation</h1>
        <p id="subjectText"></p>
    </div>
</div>

<div class="messages-area" id="messagesArea">
    <div class="loading">Chargement de la conversation...</div>
</div>

<div class="input-area">
    <div class="inner">
        <textarea id="messageInput" rows="1" placeholder="Ecrivez votre message..."></textarea>
        <button class="send" id="sendBtn" title="Envoyer">➤</button>
    </div>
</div>

<script>
const API_BASE = '/api/chat/public';

function getToken() {
    const params = new URLSearchParams(window.location.search);
    return params.get('token');
}

const token = getToken();

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDate(d) {
    const date = new Date(d);
    const today = new Date();
    const isToday = date.toDateString() === today.toDateString();

    if (isToday) {
        return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) +
        ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

let conversation = null;

// ============================================================
// CHARGEMENT INITIAL
// ============================================================
async function loadConversation() {
    if (!token) {
        document.getElementById('messagesArea').innerHTML = '<div class="loading" style="color:#f87171;">Lien invalide.</div>';
        return;
    }

    try {
        const res = await fetch(API_BASE + '/' + token);
        if (!res.ok) {
            const err = await res.json().catch(() => ({ error: 'Conversation introuvable.' }));
            document.getElementById('messagesArea').innerHTML = '<div class="loading" style="color:#f87171;">' + escapeHtml(err.error) + '</div>';
            return;
        }

        const data = await res.json();
        conversation = data.conversation;

        // Header
        document.getElementById('companyName').textContent = conversation.companyName || 'Conversation';

        if (conversation.companyLogo) {
            const logo = document.getElementById('companyLogo');
            logo.src = conversation.companyLogo;
            logo.style.display = 'block';
        }

        if (conversation.subject) {
            document.getElementById('subjectText').textContent = conversation.subject;
        }

        renderMessages(data.messages);
    } catch (err) {
        document.getElementById('messagesArea').innerHTML = '<div class="loading" style="color:#f87171;">Erreur de chargement.</div>';
    }
}

function renderMessages(messages) {
    const area = document.getElementById('messagesArea');
    area.innerHTML = '';

    if (messages.length === 0) {
        area.innerHTML = '<div class="info-banner">Commencez la conversation en envoyant un message.</div>';
        return;
    }

    for (const m of messages) {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.senderType === 'client' ? 'client' : 'owner');
        div.innerHTML = escapeHtml(m.body) + '<span class="meta">' + formatDate(m.createdAt) + '</span>';
        area.appendChild(div);
    }

    area.scrollTop = area.scrollHeight;
}

// ============================================================
// ENVOI D'UN MESSAGE
// ============================================================
document.getElementById('sendBtn').addEventListener('click', async () => {
    const input = document.getElementById('messageInput');
    const body = input.value.trim();

    if (!body) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;

    try {
        const res = await fetch(API_BASE + '/' + token + '/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ body: body })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur');

        // Ajouter le message a l'ecran
        const area = document.getElementById('messagesArea');
        const infoBanner = area.querySelector('.info-banner');
        if (infoBanner) infoBanner.remove();

        const div = document.createElement('div');
        div.className = 'msg client';
        div.innerHTML = escapeHtml(body) + '<span class="meta">' + formatDate(new Date()) + '</span>';
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;

        input.value = '';
        input.style.height = 'auto';
    } catch (err) {
        alert('Erreur : ' + err.message);
    } finally {
        btn.disabled = false;
    }
});

// Entree pour envoyer (Shift+Entree pour nouvelle ligne)
document.getElementById('messageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('sendBtn').click();
    }
});

// Auto-resize
const input = document.getElementById('messageInput');
input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ============================================================
// RAFRAICHISSEMENT PERIODIQUE (toutes les 10s)
// ============================================================
setInterval(async () => {
    if (!token || !conversation) return;

    try {
        const res = await fetch(API_BASE + '/' + token);
        if (!res.ok) return;

        const data = await res.json();

        // Verifier si de nouveaux messages sont arrives
        const area = document.getElementById('messagesArea');
        const currentCount = area.querySelectorAll('.msg').length;

        if (data.messages.length > currentCount) {
            renderMessages(data.messages);
        }
    } catch (err) {
        // Silencieux
    }
}, 10000);

// Charger au demarrage
loadConversation();
</script>
</body>
</html>
